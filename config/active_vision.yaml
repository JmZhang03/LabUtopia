name: Active_vision

task_type: "active_vision"
controller_type: "active_vision"

sub_task_type: "pick"
sub_controller_type: "pick"

mode: "collect"

usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"


max_episodes: 10

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb', "camera_3_rgb": 'camera_3_rgb'}
  # policy_model_path: "outputs/exp_data/1_pick_bottle/2_static/train_act/checkpoints/latest.ckpt"
  # policy_config_path: "outputs/exp_data/1_pick_bottle/2_static/train_act/.hydra/config.yaml"
  # normalizer_path: "outputs/exp_data/1_pick_bottle/2_static/train_act/checkpoints/normalize.ckpt"
  policy_model_path: "outputs/exp_data/1_pick_bottle/3_active/train_act/checkpoints/latest.ckpt"
  policy_config_path: "outputs/exp_data/1_pick_bottle/3_active/train_act/.hydra/config.yaml"
  normalizer_path: "outputs/exp_data/1_pick_bottle/3_active/train_act/checkpoints/normalize.ckpt"
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 2000
  obj_paths:
    - path: "/World/conical_bottle02"
      position_range:
        x: [-0.05, 0.05]
        y: [-0.95, -1.05]
        z: [0.8, 0.8]
    
    - path: "/World/DryingBox_01"
      position_range:
        x: [0.0, 0.0]
        y: [-0.5, -0.5]
        z: [0.7, 0.7]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [-5.24, 4.63, 4.13]
    resolution: [256, 256]
    focal_length: 6
    orientation: [-0.29, -0.20, 0.52, 0.78]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_2"
    resolution: [256, 256]
    image_type: "rgb"

  - prim_path: "/World/Ridgebase/panda_hand/Camera"
    name: "camera_3"
    resolution: [256, 256]
    clipping_range: [0.2, 6.0]
    image_type: "rgb"

robot:
  - prim_path: "/World/Franka"
    name: "franka"
    type: "franka"
    position: [-0.7, -0.65, 0.71]

  - prim_path: "/World/Ridgebase"
    name: "ridgebase"
    type: "ridgebase"
    position: [-1.2, -1.5, 0.0]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}