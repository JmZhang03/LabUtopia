name: Active_single

task_type: "pick"
controller_type: "pick"

mode: "collect"

usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"

max_episodes: 10

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 1000
  obj_paths:
    - path: "/World/conical_bottle02"
      position_range:
        x: [-0.05, 0.05]
        y: [-0.95, -1.05]
        z: [0.8, 0.8]
    
    - path: "/World/DryingBox_01"
      position_range:
        x: [0.0, 0.0]
        y: [-0.5, -0.5]
        z: [0.7, 0.7]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [-5.24, 4.63, 4.13]
    resolution: [256, 256]
    focal_length: 6
    orientation: [-0.29, -0.20, 0.52, 0.78]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_2"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  prim_path: "/World/Franka"
  name: "franka"
  type: "franka"
  position: [-0.7, -0.65, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}