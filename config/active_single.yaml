name: pick_single

task_type: "pick"
controller_type: "pick"

mode: "infer"

usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"

max_episodes: 50

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb'}
  policy_model_path: "outputs/exp_data/pick/1_single/train_act/checkpoints/latest.ckpt"
  policy_config_path: "outputs/exp_data/pick/1_single/train_act/.hydra/config.yaml"
  normalizer_path: "outputs/exp_data/pick/1_single/train_act/checkpoints/normalize.ckpt"
  # policy_model_path: "outputs/exp_data/pick/1_single/train_dp/checkpoints/latest.ckpt"
  # policy_config_path: "outputs/exp_data/pick/1_single/train_dp/.hydra/config.yaml"
  # normalizer_path: "outputs/exp_data/pick/1_single/train_dp/checkpoints/normalize.ckpt"  
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 1500
  obj_paths:
    - path: "/World/conical_bottle02"
      position_range:
        x: [-0.20, -0.16] # act  # [-0.20,  0.00]  # [-0.15, -0.13] # dp  
        y: [-0.95, -0.99] # act  # [-0.95, -1.15]  # [-1.05, -1.07] # dp  
        z: [0.78, 0.78]
    
    - path: "/World/DryingBox_01"
      position_range:
        x: [0.0, 0.0]
        y: [-0.5, -0.5]
        z: [0.7, 0.7]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2.63, 3.00, 5.78]
    resolution: [256, 256]
    focal_length: 8
    orientation: [0.30, 0.12, 0.37, 0.87]
    image_type: "rgb"

  # - prim_path: "/World/Franka/panda_hand/arm_camera"
  #   name: "camera_1"
  #   resolution: [256, 256]
  #   image_type: "rgb"

robot:
  prim_path: "/World/Franka"
  name: "franka"
  type: "franka"
  position: [-0.7, -0.65, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}