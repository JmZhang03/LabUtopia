name: Level1_pick

task_type: "pick"
controller_type: "pick"

mode: "infer"

usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"


max_episodes: 50

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

  policy_model_path: "outputs/train/pick_act/checkpoints/epoch=270-train_loss=0.004.ckpt"
  policy_config_path: "outputs/train/pick_act/.hydra/config.yaml"
  normalizer_path: "outputs/train/pick_act/checkpoints/normalize.ckpt"

  # policy_model_path: "outputs/train/pick_dp/checkpoints/epoch=150-train_loss=0.001.ckpt"
  # policy_config_path: "outputs/train/pick_dp/.hydra/config.yaml"
  # normalizer_path: "outputs/train/pick_dp/checkpoints/normalize.ckpt"

task:
  max_steps: 1500
  obj_paths:
    - path: "/World/conical_bottle02"
      position_range:
        x: [0.21, 0.36]
        y: [-0.08, 0.08]
        z: [0.80, 0.80]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2, 0, 2]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 2.5]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}