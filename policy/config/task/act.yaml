name: pick_single

image_shape: [3, 256, 256]
dataset_path: outputs/exp_data/pick/1_single/dataset
obs_keys: &obs_keys ['camera_1_rgb', 'agent_pose']
camera_names: ['camera_1_rgb']

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    camera_1_rgb:
      shape: ${task.image_shape}
      type: rgb
    # camera_2_rgb:
    #   shape: ${task.image_shape}
    #   type: rgb
    agent_pose:
      shape: [8]
      type: low_dim
  action: 
    shape: [8]


dataset:
  _target_: policy.dataset.act_image_dataset.ACTImageDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  camera_names: ${task.camera_names}
  seed: 42
  val_ratio: 0.00
  horizon: ${horizon}
  n_obs_steps: ${dataset_obs_steps}